# PLACEHOLDER — GXGlobal.cfg de USB Loader GX
#
# Este archivo es un placeholder de desarrollo/test para
# oscwii_installer.py; wiibackup-manager NO lo genera ni lo interpreta.
# Sirve para que la lógica de inyección de "Golden Configs" (Paso 2) tenga
# algo real que copiar mientras se construye, hasta que lo reemplaces con
# tu config maestra de verdad.
#
# FORMATO (investigado contra fuentes primarias, no asumido):
#   - Texto plano, codificación ASCII/Latin-1, una asignación por línea:
#     "clave = valor". Sin secciones [tipo INI], sin comillas alrededor
#     de los valores.
#   - Confirmado leyendo el parser real de USB Loader GX
#     (wiidev/usbloadergx, source/settings/CSettings.cpp, rama "enhanced"):
#     `ParseLine()` corta cada línea en el primer '=' con `strchr(line, '=')`
#     y si no lo encuentra, simplemente IGNORA la línea (no es un error).
#     Eso es lo que permite que esta cabecera de comentario (que no tiene
#     '=') conviva en el archivo sin romper nada si alguna vez se cargara
#     por error con el USB Loader GX real.
#   - `Save()` regenera el archivo entero con `fprintf(file, "clave = %d\n", ...)`
#     por cada opción: la app real NUNCA escribe comentarios, así que un
#     GXGlobal.cfg "de verdad" no los va a tener. Los de acá son solo para
#     este placeholder.
#   - Ruta real en el destino, también confirmada en el mismo archivo
#     (constructor de CSettings): "%s/apps/usbloader_gx/" + "GXGlobal.cfg",
#     es decir: <destino>/apps/usbloader_gx/GXGlobal.cfg. Ojo con el
#     nombre de la carpeta: "usbloader_gx" CON guión bajo, no "usbloadergx"
#     ni "UsbLoaderGX".
#
# USB Loader GX SÍ está en Open Shop Channel (slug "usbloader_gx",
# verificado el 2026-10-18; esta nota decía lo contrario). Por eso la
# Homebrew Store mira este archivo al instalarlo, y como lleva la marca
# PLACEHOLDER de la primera línea NO lo copia a la unidad del cliente (ver
# `golden_configs.is_placeholder`): USB Loader GX arma su propio
# GXGlobal.cfg con los valores de fábrica. Para tener una configuración
# maestra de verdad, reemplazá este archivo entero por un GXGlobal.cfg que
# haya guardado USB Loader GX (sin esta cabecera).
videomode = 1
language = 10
volume = 80
sfxvolume = 80
covers_path = sd:/config/images/
GameCubePath = sd:/games/
cios = 249
LoaderMode = 9
rumble = 1
wiilight = 1
CacheBNRFiles = 1
parentalcontrol = 0
ParentalBlocks = FFFFFFFF
