[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiibackup-manager-linux"
version = "0.1.5"
description = "Gestor de respaldos de Wii (ISO/WBFS) para Linux, al estilo de Wii Backup Manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GameFix SPS" }]
dependencies = [
    "PyGObject>=3.42",
]

[project.scripts]
wiibackup-manager = "wiibackup_manager.app:main"

[tool.setuptools.packages.find]
include = ["wiibackup_manager*"]
