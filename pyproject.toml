[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wiibackup-manager-linux"
version = "0.2.0"
description = "Gestor de respaldos de Wii (ISO/WBFS) para Linux, al estilo de Wii Backup Manager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GameFix SPS" }]
dependencies = [
    "PyGObject>=3.42",
]

[project.scripts]
wiibackup-manager = "wiibackup_manager.app:main"

[tool.setuptools.packages.find]
include = ["wiibackup_manager*"]

# El .desktop y los iconos se instalan en el sistema (o en ~/.local
# con --user). Van acá y no en un setup.py aparte para no tener la
# configuracion de empaquetado repartida en dos archivos: los paquetes
# ya se declaran arriba con packages.find.
[tool.setuptools.data-files]
"share/applications" = ["data/com.gamefixsps.WiiBackupManager.desktop"]
# Catálogos de traducción compilados. El .mo se versiona junto al .po (lo
# regenera tools/update-translations.sh) para que `pip install .` funcione
# sin tener gettext instalado: setuptools copia archivos, no compila nada.
# Un idioma nuevo se agrega acá con su propia línea.
"share/locale/en/LC_MESSAGES" = ["data/locale/en/LC_MESSAGES/wiibackup-manager.mo"]
"share/icons/hicolor/16x16/apps" = ["data/icons/hicolor/16x16/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/24x24/apps" = ["data/icons/hicolor/24x24/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/32x32/apps" = ["data/icons/hicolor/32x32/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/48x48/apps" = ["data/icons/hicolor/48x48/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/64x64/apps" = ["data/icons/hicolor/64x64/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/128x128/apps" = ["data/icons/hicolor/128x128/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/256x256/apps" = ["data/icons/hicolor/256x256/apps/com.gamefixsps.WiiBackupManager.png"]
"share/icons/hicolor/512x512/apps" = ["data/icons/hicolor/512x512/apps/com.gamefixsps.WiiBackupManager.png"]
# Configuraciones maestras ("Golden Configs") que golden_configs.py copia
# a la unidad de destino después de instalar ciertas apps de homebrew
# puntuales desde la Homebrew Store. Van en assets/ (no en data/) porque
# no son un recurso de la interfaz de esta app sino contenido de terceros
# (formatos de USB Loader GX / Nintendont) que se redistribuye tal cual;
# `golden_configs._candidate_asset_dirs` sabe encontrarlas acá instaladas.
"share/wiibackup-manager/configs/usbloadergx" = ["assets/configs/usbloadergx/GXGlobal.cfg"]
"share/wiibackup-manager/configs/nintendont" = ["assets/configs/nintendont/nincfg.bin"]
