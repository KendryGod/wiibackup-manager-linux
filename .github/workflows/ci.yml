name: CI

on:
  push:
  pull_request:

# Una serie de pushes seguidos al mismo branch cancela las corridas
# viejas: lo que importa es si el último commit está sano.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pruebas y smoke test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # PyGObject se instala desde apt y no con pip: por pip habría que
      # compilarlo contra las cabeceras de GObject, que tarda y se rompe
      # con cada cambio de versión. El python3-gi del sistema ya viene
      # armado contra el GTK del sistema, que es como corre la app en la
      # máquina de un usuario.
      #
      # gettext hace falta para las pruebas de traducción (msgfmt), y
      # xvfb + dbus para el smoke test: la app es un Adw.Application, así
      # que necesita un display y un bus de sesión.
      - name: Instalar GTK4, libadwaita y herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libadwaita-1-0 \
            python3-pytest \
            gettext \
            xvfb \
            dbus-x11

      - name: Versiones
        run: |
          python3 --version
          python3 -m pytest --version
          python3 -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version())"

      # Primero lo que no necesita display: si la lógica está rota, se ve
      # en seguida y sin el ruido de Xvfb.
      - name: Pruebas de lógica (sin display)
        run: python3 -m pytest -v -m "not gui"

      # WBM_REQUIRE_GUI=1 hace que el smoke test FALLE en vez de saltearse
      # si el display no está: un skip acá dejaría el check en verde sin
      # haber arrancado la app nunca.
      - name: Smoke test (la app arranca de verdad)
        env:
          WBM_REQUIRE_GUI: "1"
          GDK_BACKEND: x11
          GSETTINGS_BACKEND: memory
        run: |
          dbus-run-session -- \
            xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            python3 -m pytest -v -m gui

      # Que el paquete se pueda construir e instalar, con el .desktop, los
      # íconos y los catálogos de traducción en su lugar. Sin esto, un
      # error en pyproject.toml recién aparecería cuando alguien intenta
      # instalar la app.
      - name: Construir e instalar el paquete
        run: |
          python3 -m pip install --break-system-packages --user build
          python3 -m build --wheel
          python3 -m pip install --break-system-packages --no-deps \
            --prefix="$RUNNER_TEMP/prefijo" dist/*.whl

      # Los data_files NO caen en <prefijo>/share: Debian y Ubuntu parchean
      # sysconfig con el esquema "posix_local", que intercala un local/ en
      # el prefijo (<prefijo>/local/share, <prefijo>/local/lib/.../dist-packages).
      # No es culpa de --break-system-packages, que solo desactiva la
      # protección de PEP 668. En vez de hardcodear ese local/ -- que en
      # Fedora o Arch no existe -- le preguntamos a sysconfig la misma ruta
      # de datos que usó pip, con el mismo prefijo.
      - name: Verificar los archivos de datos instalados
        run: |
          DATOS=$(python3 -c "import os, sysconfig; p = os.environ['RUNNER_TEMP'] + '/prefijo'; print(sysconfig.get_path('data', vars={'base': p, 'platbase': p}))")
          echo "--- archivos de datos instalados en $DATOS ---"
          find "$DATOS/share" -type f | sort
          test -f "$DATOS/share/applications/com.gamefixsps.WiiBackupManager.desktop"
          test -f "$DATOS/share/locale/en/LC_MESSAGES/wiibackup-manager.mo"
          test -f "$DATOS/share/icons/hicolor/256x256/apps/com.gamefixsps.WiiBackupManager.png"

      # El .desktop tiene que ser válido para que el escritorio lo tome, y
      # su Exec no puede volver a depender del PATH del usuario.
      - name: Validar el .desktop
        run: |
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate data/com.gamefixsps.WiiBackupManager.desktop
          grep -q '^Exec=python3 -m wiibackup_manager$' \
            data/com.gamefixsps.WiiBackupManager.desktop
