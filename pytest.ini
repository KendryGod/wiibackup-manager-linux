[pytest]
testpaths = tests
markers =
    gui: necesita un display (se corre bajo Xvfb en CI; se saltea sin display)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Varios tests escriben archivos reales bajo `tmp_path` (juegos de
# prueba, ZIPs, ISOs sintéticas -ver conftest.py-), y por defecto pytest
# conserva esos directorios de las últimas 3 corridas para poder
# inspeccionarlos después de un fallo. En un tmpfs chico (p. ej. 7.7 GB)
# eso alcanza a acumular varios GB en /tmp/pytest-of-$USER solo de
# correr la suite seguido. Acá se achica a lo mínimo útil: guardar nomás
# la corrida más reciente, y de esa, solo los directorios de los tests
# que fallaron (una corrida en verde no deja casi nada atrás).
tmp_path_retention_count = 1
tmp_path_retention_policy = failed
